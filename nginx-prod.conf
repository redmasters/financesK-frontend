server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Configurações de segurança
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.yourdomain.com https://staging-api.yourdomain.com;" always;

    # Configurações de cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Configuração para SPA (Single Page Application)
    location / {
	    try_files $uri $uri/ /index.html;
	    add_header Cache-Control "no-cache, no-store, must-revalidate";
	    add_header Pragma "no-cache";
	    add_header Expires "0";
    }

    # Proxy para o backend — o nome "app" resolve pelo DNS interno do Docker
    location /api/ {
	    proxy_pass http://app:8080;
	    proxy_http_version 1.1;
	    proxy_set_header Host $host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;
	    proxy_read_timeout 60s;
	    proxy_connect_timeout 10s;
    }

    # Configurações de compressão
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # Configurações de segurança adiciais
    server_tokens off;

    # Timeout configurations
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;
}
